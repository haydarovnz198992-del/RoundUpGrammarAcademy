ct='would';q=`If I had more time, I ___ learn Italian.`;wrong=['will','would','had','am'];rule='Second conditional: if + past, would + base verb.';break;case'gerund':correct='reading';q=`I enjoy ___ in the evening.`;wrong=['read','reading','to reading','reads'];rule='Enjoy is followed by a gerund (-ing).' ;break;case'pastperfect':correct='had';q=`She ___ left before I arrived.`;wrong=['has','had','was','is'];rule='Past Perfect: had + past participle.';break;case'condition3':correct='had';q=`If I ___ studied, I would have passed.`;wrong=['have','had','would','was'];rule='Third conditional: if + had + past participle.';break;case'inversion':correct='have I';q=`Never ___ seen such a beautiful view.`;wrong=['I have','have I','I had','had I have'];rule='Negative adverbials such as never can require inversion.';break;case'mixed':correct='would';q=`If I had slept well, I ___ feel better now.`;wrong=['will','would','had','have'];rule='A mixed conditional can link a past condition to a present result.';break;default:correct='is';q='She ___ ready.';wrong=['is','are','am','be'];rule='Use is with she.'}

if(page==='levels')html=`<div class="hero"><h1>📚 ${t('levels')}</h1><p>Starter → Round-Up 6 • Barcha darajalar ochiq</p></div><div class="grid">${levels.map((n,l)=>{let done=topics[l].filter((_,i)=>mastered(l,i)).length;return `<div class="card level"><span class="tag">${l===0?'Starter':'Level '+l}</span><h3>${n}</h3><p class="muted">${done}/${topics[l].length} ${t('mastered').toLowerCase()}</p><div class="progress"><div style="width:${done/topics[l].length*100}%"></div></div><br><button class="btn" onclick="level=${l};nav('topics')">${t('topics')} →</button></div>`}).join('')}</div>`;
if(page==='topics')html=`<button class="btn ghost" onclick="nav('levels')">← ${t('back')}</button><h1>${levels[level]} · ${t('topics')}</h1><div class="grid">${topics[level].map((o,i)=>{let s=stats(level,i);return `<div class="card"><span class="tag">${mastered(level,i)?'✓ '+t('mastered'):'Grammar'}</span><h3>${esc(o.name)}</h3><p class="muted">${s.best===null?'Hali test yo‘q':'Eng yaxshi: '+s.best+'%'}</p><button class="btn" onclick="topic=${i};nav('topic')">${t('start')} →</button></div>`}).join('')}</div><br><div class="card"><h2>🏆 ${t('exam')}</h2><p class="muted">${topics[level].every((_,i)=>mastered(level,i))?'50 / 100 / 150 savol · ≥90%':t('locked')}</p><button class="btn" ${topics[level].every((_,i)=>mastered(level,i))?'':'disabled'} onclick="mode='final';nav('settings')">${t('exam')} →</button></div>`;
if(page==='topic'){let o=topics[level][topic],s=stats(level,topic),k=topicKey(level,topic),n=pending(k).length;html=`<button class="btn ghost" onclick="nav('topics')">← ${t('back')}</button><div class="card" style="margin-top:15px"><span class="tag">${levels[level]}</span><h1>${esc(o.name)}</h1><h3>📖 Grammar rule</h3><p>${esc(o.rule)}</p><div class="notice">${o.examples.map(esc).join('<br>')}</div><br><div class="row"><button class="btn secondary" onclick="mode='practice';startPractice()">✍️ ${t('practice')}</button><button class="btn" onclick="mode='test';nav('settings')">📝 ${t('test')}</button></div>${n?`<p class="bad">⚠ ${n} ta xato savolni mashqda to‘g‘ri bajarish kerak.</p>`:''}<h3>${t('history')}</h3>${s.arr.length?s.arr.slice().reverse().map(a=>`<p class="small">${new Date(a.date).toLocaleString()} · <b>${a.score}%</b> · ${a.correct}/${a.total}</p>`).join(''):`<p class="muted">${t('none')}</p>`}</div>`}
if(page==='settings'){let isFinal=mode==='final';html=`<button class="btn ghost" onclick="nav('${isFinal?'topics':'topic'}')">← ${t('back')}</button><div class="card" style="margin-top:15px"><h2>${isFinal?t('exam'):t('settings')}</h2><div class="stack"><label>${t('count')}<br><select class="field" id="count">${(isFinal?[50,100,150]:[10,20,30,50,100]).map(n=>`<option value="${n}" ${settings.count===n?'selected':''}>${n}</option>`).join('')}</select></label>${isFinal?'<p class="muted">30% easy · 40% medium · 30% hard</p>':`<label>${t('difficulty')}<br><select class="field" id="diff"><option value="mixed">${t('all')}</option><option value="easy">${t('easy')}</option><option value="medium">${t('medium')}</option><option value="hard">${t('hard')}</option></select></label>`}<label><input type="checkbox" id="timed" ${settings.timed?'checked':''}> ${t('timed')} ${isFinal?'(1 daqiqa / savol)':'(1 daqiqa / savol)'}</label><button class="btn" onclick="launch()">${t('start')} →</button></div></div>`}
if(page==='running'){if(!store.active){page='home';render();return}if(!activeCheck())return;let a=store.active,q=a.questions[a.pos],sel=a.answers[a.pos],answered=a.answers.filter(x=>x!==null).length;html=`<div class="row between"><button class="btn ghost" onclick="cancelTest()">✕ ${t('back')}</button><span class="tag">${a.final?t('exam'):topics[a.level][a.topic].name}</span><span id="clock" class="tag">${a.deadline?'⏳':''}</span></div><div class="card" style="margin-top:15px"><div class="row between"><b>${a.pos+1} / ${a.questions.length}</b><span class="muted">${answered} answered</span></div><div class="progress" style="margin:14px 0 25px"><div style="width:${answered/a.questions.length*100}%"></div></div><div class="question">${esc(q.text)}</div><p><button class="btn secondary" onclick="speak(${JSON.stringify(q.text).replace(/"/g,'&quot;')})">${t('speak')}</button></p>${q.opts.map((o,i)=>`<button class="option ${sel===i?'selected':''}" onclick="answer(${i})"><b>${'ABCD'[i]}.</b> ${esc(o)}</button>`).join('')}<div class="row between" style="margin-top:20px"><button class="btn secondary" ${a.pos===0?'disabled':''} onclick="move(-1)">← ${t('previous')}</button><button class="btn secondary" onclick="move(1)">${a.pos===a.questions.length-1?t('skip'):t('next')} →</button><button class="btn" onclick="confirmFinish()">${t('finish')}</button></div><p class="muted small">${t('unanswered')}: ${a.questions.length-answered}. Javobni test tugaguncha o‘zgartirishingiz mumkin.</p></div>`}
if(page==='result'){let a=lastResult;if(!a){page='home';render();return}html=`<div class="hero"><h1>${t('result')}: ${a.score}% ${a.score>=90?'🎉':'📘'}</h1><p>${a.score>=90?t('pass'):t('fail')}</p></div><div class="grid"><div class="card"><div class="big">${a.correct}</div>${t('correct')}</div><div class="card"><div class="big">${a.total-a.correct}</div>${t('wrong')}</div><div class="card"><div class="big">${Math.max(0,Math.round(a.seconds/60))} min</div>Vaqt sarfi</div></div><br><div class="row"><button class="btn" onclick="nav('levels')">${t('levels')}</button><button class="btn secondary" onclick="mode='practice';startPractice()">${t('mistakes')} →</button></div>`}
if(page==='practice'){let qs=practiceQuestions();if(!qs.length){html=`<div class="success">🎉 Barcha majburiy xatolar to‘g‘rilandi!</div><br><button class="btn" onclick="nav('topic')">${t('back')}</button>`}else{practiceIndex=Math.min(practiceIndex,qs.length-1);let q=qs[practiceIndex];html=`<button class="btn ghost" onclick="nav('topic')">← ${t('back')}</button><div class="card" style="margin-top:14px"><span class="tag">${t('practice')} · ${practiceIndex+1}/${qs.length}</span><h2>${esc(q.text)}</h2>${q.opts.map((o,i)=>`<button class="option ${practiceAnswer!==null?(o===q.correct?'correct':practiceAnswer===i?'wrong':''):''}" ${practiceAnswer!==null?'disabled':''} onclick="practicePick(${i})">${'ABCD'[i]}. ${esc(o)}</button>`).join('')}${practiceAnswer!==null?`<div class="${q.opts[practiceAnswer]===q.correct?'success':'notice'}">${q.opts[practiceAnswer]===q.correct?t('correct'):t('wrong')} · ${esc(q.rule)}</div><br><button class="btn" onclick="practiceNext()">${t('next')} →</button>`:''}</div>`}}
if(page==='mistakes'){let entries=Object.entries(store.mistakes).sort((a,b)=>b[1].date-a[1].date);html=`<h1>📝 ${t('mistakes')}</h1><p class="muted">Xatolar tarixi o‘zlashtirilgandan keyin ham saqlanadi.</p><div class="stack">${entries.length?entries.slice(0,100).map(([id,m])=>`<div class="card"><span class="tag">${m.cleared?'✓ '+t('mastered'):'Mashq kerak'}</span><p><b>${esc(m.text)}</b></p><p class="small">${esc(m.rule)}</p><button class="btn secondary" onclick="level=${m.level};topic=${m.topic};mode='practice';startPractice()">${t('practice')}</button></div>`).join(''):`<div class="card">${t('none')}</div>`}</div>`}
if(page==='certs')html=`<h1>🏅 ${t('certs')}</h1><div class="stack">${levels.map((name,l)=>{let c=store.certs[l];return `<div class="card"><h3>${name}</h3>${c?`<p class="good">Sertifikat olindi · Eng yuqori natija: ${c.best}%</p><p class="small">Amal qiladi: ${new Date(c.expiry).toLocaleDateString()}</p><p class="muted">Demo sertifikat: haqiqiy QR tekshirish serveri hali ulanmagan.</p>`:`<p class="muted">${t('locked')}</p>`}</div>`}).join('')}</div>`;
$('app').innerHTML=html; if(page==='running')tickClock()}
let lastResult=null;function launch(){if(store.active&&!confirm('Oldingi davom etayotgan testni almashtirasizmi?'))return;let count=+$('count').value,diff=mode==='final'?'mixed':$('diff').value,timed=$('timed').checked;settings={count,diff,timed};let k=topicKey(level,topic);if(mode==='test'&&pending(k).length){alert(t('required'));return}if(mode==='final'&&!topics[level].every((_,i)=>mastered(level,i))){alert(t('locked'));return}let arr=mode==='final'?allPool(level):pool(level,topic);if(mode==='final'){let weight=arr.map(q=>{let i=topics[level].findIndex(o=>o.id===q.topic);return {q,weak:100-(stats(level,i).best||0)}}).sort((a,b)=>b.weak-a.weak);let byDiff={easy:[],medium:[],hard:[]};weight.forEach(x=>byDiff[x.q.diff].push(x.q));let quotas=[Math.round(count*.3),Math.round(count*.4)];quotas.push(count-quotas[0]-quotas[1]);arr=['easy','medium','hard'].flatMap((d,i)=>shuffle(byDiff[d],Date.now()+i).slice(0,quotas[i]))}else{arr=shuffle(arr.filter(q=>diff==='mixed'||q.diff===diff),Date.now()).slice(0,count)}let questions=arr.map(q=>({id:q.id,topic:q.topic,text:q.text,opts:q.opts,correct:q.correct,rule:q.rule,diff:q.diff}));store.active={level,topic,final:mode==='final',questions,answers:Array(questions.length).fill(null),pos:0,started:Date.now(),deadline:timed?Date.now()+questions.length*60000:null};save();page='running';render()}
function answer(i){let a=store.active;a.answers[a.pos]=i;save();render()}function move(d){let a=store.active;a.pos=Math.max(0,Math.min(a.questions.length-1,a.pos+d));save();render()}function confirmFinish(){let a=store.active;if(!a)return;endTest(false)}function cancelTest(){if(confirm('Testni bekor qilasizmi? Barcha joriy javoblar o‘chiriladi.')){store.active=null;save();nav('topics')}}function endTest(expired){let a=store.active;if(!a)return;let correct=a.questions.filter((q,i)=>q.opts[a.answers[i]]===q.correct).length;let result={score:Math.round(correct/a.questions.length*100),correct,total:a.questions.length,date:Date.now(),seconds:Math.round((Date.now()-a.started)/1000),expired};let key=a.final?'final_'+a.level:topicKey(a.level,a.topic);(store.attempts[key]??=[]).push(result);a.questions.forEach((q,i)=>{if(q.opts[a.answers[i]]!==q.correct){store.mistakes[q.id]={key:a.final?'final_'+a.level:topicKey(a.level,topics[a.level].findIndex(o=>o.id===q.topic)),level:a.level,topic:topics[a.level].findIndex(o=>o.id===q.topic),text:q.text,rule:q.rule,date:Date.now(),cleared:false}}});if(a.final&&result.score>=90){let old=store.certs[a.level],best=Math.max(old?.best||0,result.score);store.certs[a.level]={best,expiry:new Date(Date.now()+3*365.2425*86400000).toISOString(),issued:old?.issued||Date.now(),id:old?.id||'RGA-'+(a.level+1)+'-'+Date.now().toString(36).toUpperCase()}}lastResult=result;store.active=null;save();page='result';render()}
function practiceQuestions(){let key=topicKey(level,topic);let ids=pending(key);if(ids.length)return pool(level,topic).filter(q=>ids.includes(q.id));return shuffle(pool(level,topic),42).slice(0,20)}function startPractice(){practiceIndex=0;practiceAnswer=null;page='practice';render()}function practicePick(i){practiceAnswer=i;render()}function practiceNext(){let qs=practiceQuestions(),q=qs[practiceIndex];let wasPending=pending(topicKey(level,topic)).length>0;let cleared=false;if(q&&practiceAnswer!==null&&q.opts[practiceAnswer]===q.correct&&store.mistakes[q.id]){store.mistakes[q.id].cleared=true;save();cleared=true}practiceAnswer=null;let next=practiceQuestions();if(!wasPending||!cleared)practiceIndex++;if(practiceIndex>=next.length)practiceIndex=0;render()}function speak(text){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text.replace('___','blank'));u.lang='en-US';speechSynthesis.speak(u)}}function tickClock(){let a=store.active;if(!a||page!=='running')return;let el=$('clock');if(!el)return;if(a.deadline){let remaining=Math.max(0,Math.ceil((a.deadline-Date.now())/1000));el.textContent='⏳ '+Math.floor(remaining/60)+':'+String(remaining%60).padStart(2,'0');if(remaining===0){endTest(true);return}}else el.textContent='∞'}setInterval(()=>{if(page==='running')tickClock()},1000);$('lang').onchange=e=>{store.lang=e.target.value;save();render()};$('theme').onclick=()=>{store.theme=!store.theme;save();render()};render();
</script></body></html>
